[package]
name = "old-dialogs-radmir"
version = "9.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "OldDialogs"
crate-type = ["cdylib"]

[[bin]]
name = "OldDialogsLauncher"
path = "src/launcher/main.rs"

[dependencies]
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
